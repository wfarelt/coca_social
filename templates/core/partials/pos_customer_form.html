<form method="post" action="{% url 'pos_customer_create' %}" hx-post="{% url 'pos_customer_create' %}" hx-target="#customer-modal-body" hx-swap="innerHTML" class="row g-3">
  {% csrf_token %}
  {% for field in form %}
  <div class="col-12 col-md-6 {% if field.name == 'credit_limit' %}col-md-4{% endif %}">
    <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
    {{ field }}
    {% for error in field.errors %}<div class="text-danger small">{{ error }}</div>{% endfor %}
  </div>
  {% endfor %}
  <div class="col-12 d-flex justify-content-end gap-2">
    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
    <button class="btn btn-primary" type="submit">Guardar cliente</button>
  </div>
</form>
