<div class="cart-list">
  {% for item in cart %}
  <article class="cart-item">
    <div>
      <strong>{{ item.name }}</strong>
      <p class="mb-0 text-muted small">Precio ${{ item.price }}</p>
    </div>
    <div class="d-flex align-items-center gap-2">
      <form method="post" action="{% url 'pos_update_item' item.id %}">
        {% csrf_token %}
        <input type="hidden" name="action" value="decrease">
        <button class="btn btn-sm btn-outline-secondary" type="submit">-</button>
      </form>
      <div class="cart-meta">x{{ item.qty }}</div>
      <form method="post" action="{% url 'pos_update_item' item.id %}">
        {% csrf_token %}
        <input type="hidden" name="action" value="increase">
        <button class="btn btn-sm btn-outline-secondary" type="submit">+</button>
      </form>
    </div>
    <div class="text-end"><strong>${{ item.subtotal }}</strong></div>
  </article>
  {% empty %}
  <div class="text-center text-muted py-4">
    <p class="mb-1">Aquí aparecerán los productos elegidos</p>
    <small>Agrega artículos desde la búsqueda rápida.</small>
  </div>
  {% endfor %}
</div>
<div class="mt-3 d-flex justify-content-end">
  <form method="post" action="{% url 'pos_clear_cart' %}">
    {% csrf_token %}
    <button class="btn btn-sm btn-outline-danger" type="submit">Vaciar carrito</button>
  </form>
</div>
