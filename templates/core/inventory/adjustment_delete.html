{% extends 'base.html' %}
{% block title %}{{ page_title }} | Coca Social{% endblock %}
{% block page_title %}{{ page_title }}{% endblock %}
{% block content %}
<section class="panel">
  <div class="panel-header">
    <div>
      <h2 class="panel-title mb-1">{{ page_title }}</h2>
      <p class="panel-subtitle mb-0">{{ page_subtitle }}</p>
    </div>
    <a class="btn btn-outline-secondary btn-sm" href="{{ list_url }}">Volver al listado</a>
  </div>

  <form method="post" class="d-flex gap-2">
    {% csrf_token %}
    <button class="btn btn-danger" type="submit">Eliminar</button>
    <a class="btn btn-outline-secondary" href="{{ list_url }}">Cancelar</a>
  </form>
</section>
{% endblock %}
