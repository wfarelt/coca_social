<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Coca Social{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  {% load static %}
  <link href="{% static 'css/app.css' %}" rel="stylesheet">
</head>
<body>
  <div class="app-shell">
    <aside class="app-sidebar">
      <div class="brand-block">
        <div class="brand-mark">CS</div>
        <div>
          <div class="brand-title">Coca Social</div>
          <small class="text-secondary">Gestión de abarrotes</small>
        </div>
      </div>
      <nav class="nav flex-column sidebar-nav">
        <a class="nav-link {% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}" href="{% url 'dashboard' %}">Dashboard</a>
        <a class="nav-link {% if request.resolver_match.url_name == 'pos' %}active{% endif %}" href="{% url 'pos' %}">Punto de Venta</a>
        <a class="nav-link {% if request.resolver_match.url_name == 'inventory_overview' %}active{% endif %}" href="{% url 'inventory_overview' %}">Inventario</a>
        <a class="nav-link {% if request.resolver_match.url_name == 'purchases_overview' %}active{% endif %}" href="{% url 'purchases_overview' %}">Compras</a>
        <a class="nav-link {% if request.resolver_match.url_name == 'transfers_overview' %}active{% endif %}" href="{% url 'transfers_overview' %}">Traspasos</a>
        <a class="nav-link {% if request.resolver_match.url_name == 'customers_overview' %}active{% endif %}" href="{% url 'customers_overview' %}">Clientes</a>
        <a class="nav-link {% if request.resolver_match.url_name == 'cash_overview' %}active{% endif %}" href="{% url 'cash_overview' %}">Caja</a>
        <a class="nav-link {% if request.resolver_match.url_name == 'reports_overview' %}active{% endif %}" href="{% url 'reports_overview' %}">Reportes</a>
        <a class="nav-link {% if request.resolver_match.url_name == 'admin_overview' %}active{% endif %}" href="{% url 'admin_overview' %}">Administración</a>
      </nav>
    </aside>

    <main class="app-main">
      <header class="topbar">
        <div>
          <p class="eyebrow mb-1">Sistema comercial</p>
          <h1 class="page-title mb-0">{% block page_title %}Dashboard{% endblock %}</h1>
        </div>
        <div class="topbar-actions">
          <select class="form-select form-select-sm branch-select select2-no-search">
            <option>Sucursal Centro</option>
            <option>Sucursal Norte</option>
            <option>Sucursal Oriente</option>
          </select>
          <button class="btn btn-light btn-sm">Notificaciones</button>
          <div class="user-chip">DE</div>
        </div>
      </header>

      <section class="content-area">
        {% block content %}{% endblock %}
      </section>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/htmx.org@1.9.12"></script>
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
  {% load static %}
  <script src="{% static 'js/app.js' %}"></script>
</body>
</html>
