<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ingresar | Coca Social</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  {% load static %}
  <link href="{% static 'css/app.css' %}" rel="stylesheet">
  <style>
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at top left, rgba(25, 135, 84, 0.18), transparent 35%),
        radial-gradient(circle at bottom right, rgba(13, 110, 253, 0.16), transparent 32%),
        linear-gradient(135deg, #f4f7fb 0%, #eef4ff 100%);
      font-family: 'Inter', sans-serif;
    }
    .login-shell {
      width: min(100%, 460px);
      padding: 1.25rem;
    }
    .login-card {
      border: 1px solid rgba(15, 23, 42, 0.08);
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.9);
      box-shadow: 0 30px 80px rgba(15, 23, 42, 0.12);
      backdrop-filter: blur(10px);
      overflow: hidden;
    }
    .login-hero {
      padding: 2rem 2rem 1rem;
      background: linear-gradient(135deg, #0f172a 0%, #123b7a 100%);
      color: #fff;
    }
    .login-mark {
      width: 52px;
      height: 52px;
      border-radius: 16px;
      display: grid;
      place-items: center;
      background: rgba(255, 255, 255, 0.12);
      font-weight: 800;
      letter-spacing: 0.08em;
      margin-bottom: 1rem;
    }
    .login-body {
      padding: 2rem;
    }
  </style>
</head>
<body>
  <main class="login-shell">
    <section class="login-card">
      <div class="login-hero">
        <div class="login-mark">CS</div>
        <h1 class="h3 mb-2">Coca Social</h1>
        <p class="mb-0 text-white-50">Acceso al sistema comercial de abarrotes</p>
      </div>
      <div class="login-body">
        {% if form.errors %}
        <div class="alert alert-danger">Usuario o contraseña incorrectos.</div>
        {% endif %}
        {% if next %}
        <div class="alert alert-warning">Inicia sesión para continuar.</div>
        {% endif %}
        <form method="post" class="vstack gap-3">
          {% csrf_token %}
          <div>
            <label class="form-label" for="id_username">Usuario</label>
            <input type="text" name="username" autofocus autocapitalize="none" autocomplete="username" maxlength="150" required class="form-control" id="id_username">
          </div>
          <div>
            <label class="form-label" for="id_password">Contraseña</label>
            <input type="password" name="password" autocomplete="current-password" required class="form-control" id="id_password">
          </div>
          <button class="btn btn-primary btn-lg w-100" type="submit">Ingresar</button>
        </form>
      </div>
    </section>
  </main>
</body>
</html>
